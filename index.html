<html lang="en">
<head>

    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://site-assets.fontawesome.com/releases/v6.7.2/css/all.css">
</head>
<body>
    <header>
        <div class="main-h">
            <div class="head1">
                <ul>
                    <li><a href="">SAVE MORE ON APP</a></li>
                    <li><a href="">BECOME A SELLER</a></li>
                    <li><a href="">HELP & SUPPORT</a></li>

                <div class="logo">
                    <img src="img/logo/logo.jpg" alt="Logo" width="80px">
                </div>

                    <div class="search-input">
                        <input type="search" placeholder="Search In HAAT-BAZAR.com">
                    </div>
                    <div class="search-icon">
                        <i class="fa-regular fa-magnifying-glass"></i>

                        <a href="#"><img src="img/Add Banners/banner1.jpg" alt="banner1" draggable="false" >

                        <a href="#"><img src="img/Add Banners/banner13.jpg" alt="banner13" draggable="false"></a>

                        <div class="dot" onclick="currentSlide(4)"></div>
                        <div class="dot" onclick="currentSlide(5)"></div>
                        <div class="dot" onclick="currentSlide(6)"></div>
